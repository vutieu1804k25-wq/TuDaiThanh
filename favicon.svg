<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="favBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1729"/>
      <stop offset="70%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <radialGradient id="favCyanGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="favStoneLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="favStoneDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="favTextMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#7dd3fc"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="favNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle / Rounded Box with Neon Border -->
  <rect width="512" height="512" rx="112" fill="url(#favBg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#00f2fe" stroke-width="8" stroke-opacity="0.85" filter="url(#favNeon)"/>

  <!-- Cyan Atmosphere Glow -->
  <circle cx="256" cy="230" r="200" fill="url(#favCyanGlow)"/>

  <!-- Energy Lines -->
  <g stroke="#38bdf8" stroke-opacity="0.4" stroke-width="3">
    <line x1="256" y1="230" x2="90" y2="110"/>
    <line x1="256" y1="230" x2="422" y2="110"/>
    <line x1="256" y1="230" x2="60" y2="230"/>
    <line x1="256" y1="230" x2="452" y2="230"/>
  </g>

  <!-- Base Stone Shield -->
  <polygon points="100,240 412,240 438,320 256,410 74,320" fill="url(#favStoneDark)" stroke="#64748b" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="112,250 400,250 422,315 256,396 90,315" fill="#0f172a" stroke="#00f2fe" stroke-width="3" stroke-opacity="0.8"/>

  <!-- Left Side Tower -->
  <g>
    <polygon points="135,140 205,128 212,260 120,260" fill="url(#favStoneLight)" stroke="#0f172a" stroke-width="4"/>
    <polygon points="130,112 150,110 150,126 166,124 166,108 186,105 186,121 200,120 200,102 214,100 212,140 132,144" fill="url(#favStoneLight)" stroke="#0f172a" stroke-width="3.5"/>
    <polyline points="184,155 184,240 146,240" fill="none" stroke="#00f2fe" stroke-width="6" filter="url(#favNeon)"/>
    <rect x="146" y="172" width="22" height="32" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Right Side Tower -->
  <g>
    <polygon points="377,140 307,128 300,260 392,260" fill="url(#favStoneLight)" stroke="#0f172a" stroke-width="4"/>
    <polygon points="382,112 362,110 362,126 346,124 346,108 326,105 326,121 312,120 312,102 298,100 300,140 380,144" fill="url(#favStoneLight)" stroke="#0f172a" stroke-width="3.5"/>
    <polyline points="328,155 328,240 366,240" fill="none" stroke="#00f2fe" stroke-width="6" filter="url(#favNeon)"/>
    <rect x="344" y="172" width="22" height="32" rx="4" fill="#090d16" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Main Center Citadel Fortress -->
  <g>
    <polygon points="190,102 256,80 322,102 342,265 170,265" fill="url(#favStoneLight)" stroke="#0f172a" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="256,80 322,102 342,265 256,265" fill="#1e293b" fill-opacity="0.45"/>
    <polygon points="204,54 228,48 228,68 244,63 244,38 268,38 268,63 284,68 284,48 308,54 304,100 256,84 208,100" fill="url(#favStoneLight)" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>
    <polyline points="210,150 242,140 236,248" fill="none" stroke="#00f2fe" stroke-width="6.5" filter="url(#favNeon)"/>
    <polyline points="302,150 270,140 276,248" fill="none" stroke="#00f2fe" stroke-width="6.5" filter="url(#favNeon)"/>
    <line x1="256" y1="84" x2="256" y2="250" stroke="#090d16" stroke-width="4"/>
  </g>

  <!-- Bottom Badge: TỨ ĐẠI THÀNH -->
  <g>
    <rect x="66" y="325" width="380" height="96" rx="18" fill="#0b1329" stroke="#64748b" stroke-width="6"/>
    <rect x="76" y="335" width="360" height="76" rx="12" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-opacity="0.7"/>
    <text x="256" y="388" text-anchor="middle" font-family="'Chakra Petch', sans-serif, system-ui" font-weight="800" font-size="39" letter-spacing="2"
          fill="url(#favTextMetal)" stroke="#00f2fe" stroke-width="1.8" filter="url(#favNeon)">
      TỨ ĐẠI THÀNH
    </text>
  </g>
</svg>
